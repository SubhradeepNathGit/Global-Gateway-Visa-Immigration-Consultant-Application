<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Outfit:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    
    <!-- Preload critical hero & loader images for jitter-free instant rendering -->
    <link rel="preload" as="image" href="/Slider1.jpg" fetchpriority="high" />
    <link rel="preload" as="image" href="/Slider7.jpg" fetchpriority="high" />
    <link rel="preload" as="image" href="/Slider2.jpg" />
    
    <title>Global Gateway</title>
    <script>
      // Prevent flash: match body bg to what React will render before paint
      document.addEventListener('DOMContentLoaded', function(){}, false);
      (function(){
        var p = window.location.pathname;
        var isDark = p === '/' || p === '' || p.startsWith('/admin') || p.startsWith('/embassy');
        document.documentElement.style.backgroundColor = isDark ? '#0b1020' : '#fff';
      })();
    </script>
  </head>
  <body style="margin: 0;">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
